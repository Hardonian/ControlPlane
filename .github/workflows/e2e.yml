name: E2E Tests

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm run build:contracts

      - name: Build test kit
        run: pnpm run build:test-kit

      - name: Build packages
        run: pnpm run build

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Start stack
        run: |
          # This repository ships contracts and tooling only (no runtime
          # services), so the E2E stack runs the committed reference mocks in
          # tests/mocks/mock-server.cjs. They implement the minimal API surface
          # the E2E specs exercise (job lifecycle, truth assert/query, health)
          # and answer with contract-valid payloads.
          mkdir -p services/truthcore services/jobforge services/runner-example
          for svc in truthcore jobforge runner-example; do
            cp tests/mocks/mock-server.cjs "services/${svc}/server.cjs"
          done

          cat > services/truthcore/Dockerfile << 'EOF'
          FROM node:20-alpine
          WORKDIR /app
          RUN apk add --no-cache curl
          COPY server.cjs .
          ENV SERVICE_ROLE=truthcore
          CMD ["node", "server.cjs"]
          EXPOSE 3000
          EOF

          cat > services/jobforge/Dockerfile << 'EOF'
          FROM node:20-alpine
          WORKDIR /app
          RUN apk add --no-cache curl
          COPY server.cjs .
          ENV SERVICE_ROLE=jobforge
          CMD ["node", "server.cjs"]
          EXPOSE 3000
          EOF

          cat > services/runner-example/Dockerfile << 'EOF'
          FROM node:20-alpine
          WORKDIR /app
          RUN apk add --no-cache curl
          COPY server.cjs .
          ENV SERVICE_ROLE=runner
          CMD ["node", "server.cjs"]
          EXPOSE 3000
          EOF

          docker compose up -d --build
          sleep 15

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3001/health && \
               curl -sf http://localhost:3002/health && \
               curl -sf http://localhost:3003/health; then
              echo "All services healthy!"
              exit 0
            fi
            echo "Waiting for services... attempt $i/30"
            sleep 5
          done
          echo "Services failed to become healthy"
          docker compose logs
          exit 1

      - name: Run smoke tests
        run: pnpm run test:smoke

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          TRUTHCORE_URL: http://localhost:3001
          JOBFORGE_URL: http://localhost:3002
          RUNNER_URL: http://localhost:3003

      - name: Cleanup
        if: always()
        run: docker compose down -v

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
            smoke-report.json
          retention-days: 7
