name: Release

on:
  push:
    branches: [main, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  # semantic-release cannot succeed without registry credentials (@semantic-release/npm
  # needs NPM_TOKEN to publish). On ordinary pushes without that secret, the preflight
  # skips the release job instead of going red — a release workflow that cannot
  # succeed without credentials must not count as broken CI.
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    outputs:
      can_release: ${{ steps.check.outputs.can_release }}
    steps:
      - name: Check release credentials
        id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "can_release=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN present — release job will run."
          else
            echo "can_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret is not configured; skipping semantic-release on this push. Configure the NPM_TOKEN repository secret to enable releases."
          fi

  release:
    name: Semantic Release
    needs: preflight
    if: needs.preflight.outputs.can_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.12.0

      # semantic-release 25 requires Node ^22.14 || >=24.10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
